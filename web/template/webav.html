<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta property="og:image" content="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/live.png">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TelexOriginals | {{file_name}}</title>
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1 id="file-name">{{file_name}}</h1>
        </header>

        <div class="player-container">
            <div class="video-wrapper">
                <video class="plyr" controls poster="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/well.png">
                    <source src="{{file_url}}" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </div>

        <div class="controls">
            <button class="btn download" onclick="download()">
                <i class="fas fa-cloud-download-alt"></i> Download
            </button>
            <button class="btn copy-link" onclick="copyLink()">
                <i class="fas fa-link"></i> Copy Link
            </button>
        </div>

        <div class="container">
            <!-- VLC Button -->
            <a class="magnet" href="intent://{{ file_url | replace('https://', '') }}#Intent;scheme=https;package=org.videolan.vlc;end">
                <button class="btn download">
                    <img src="https://i.postimg.cc/15TQ4y7B/vlc.png" alt="VLC" class="player-logo"> VLC Mobile
                </button>
            </a>

            <!-- MX Player Button -->
            <a class="magnet" href="intent://{{ file_url | replace('https://', '') }}#Intent;scheme=https;package=com.mxtech.videoplayer.ad;end">
                <button class="btn copy-link">
                    <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/mx.png" alt="MX Player" class="player-logo"> MX Player
                </button>
            </a>

            <button class="btn download" onclick="playOnline('np')">
                <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/nPlayer.webp" alt="nPlayer" class="player-logo"> nPlayer
            </button>

            <button class="btn download" onclick="playOnline('sp')">
                <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/splayer.webp" alt="S Player" class="player-logo"> S Player
            </button>

            <button class="btn download" onclick="playOnline('km')">
                <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/km.webp" alt="KM Player" class="player-logo"> KM Player
            </button>
        </div>

        <div class="container">
            <header>
                <!--<a href="http://youtube.com/@avbotx"><img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/youtube.png" class="player-logo"></a>
                <a href="http://GitHub.com/Botsthe"><img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/github.png" class="player-logo"></a>-->
                <a href="http://t.me/Spidey_Professor"><img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/telegram.png" class="player-logo"></a>
               <!-- <a href="https://www.instagram.com/aman_developerr"><img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/instagram.png" class="player-logo"></a>-->
            </header>
        </div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const videoElement = document.querySelector('.plyr');
            new Plyr(videoElement);
        });

        const currentUrl = window.location.href;
        const finalUrl = currentUrl.replace("/watch/", "/dl/");

        function playOnline(player) {
            const fileUrl = finalUrl;
            let intentUrl = "";

            switch (player) {
                case "np":
                    intentUrl = `nplayer-${fileUrl}`;
                    break;
                case "sp":
                    intentUrl = `intent:${fileUrl}#Intent;action=com.young.simple.player.playback_online;package=com.young.simple.player;end`;
                    break;
                case "km":
                    intentUrl = `intent:${fileUrl}#Intent;package=com.kmplayer;end`;
                    break;
                default:
                    intentUrl = fileUrl;
            }

            window.location.href = intentUrl;
        }

        function download() {
            window.location.href = finalUrl;
        }

        function copyLink() {
            navigator.clipboard.writeText(finalUrl)
                .then(() => {
                    const feedback = document.createElement('div');
                    feedback.className = 'feedback';
                    feedback.textContent = "📋 Link copied to clipboard!";
                    feedback.setAttribute("role", "alert");
                    document.body.appendChild(feedback);
                    setTimeout(() => feedback.remove(), 3000);
                })
                .catch(err => console.error('Could not copy text: ', err));
        }
    </script>
</body>
</html>
