<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TelexOriginals | Sample Video</title>
  <link rel="icon" href="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/logo.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: #121212;
      color: #eee;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    video {
      width: 100%;
      max-width: 720px;
      border-radius: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      padding: 10px 15px;
      margin: 10px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
    }

    .btn img.player-logo {
      width: 22px;
      height: 22px;
      margin-right: 8px;
    }

    .btn.download {
      background-color: #28a745;
      color: white;
    }

    .btn.copy-link {
      background-color: #007bff;
      color: white;
    }

    .warning {
      color: #ffc107;
      margin: 20px 0;
    }
  </style>
</head>
<body>

  <h1>Sample Video</h1>

  <!-- ✅ Video Player -->
  <video class="plyr" controls poster="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/well.png">
    <source src="https://thoughtful-shayne-mlfiles-5730e5e6.koyeb.app/watch/2211?hash=AgAD1R" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- ✅ MX Player Button (intent format) -->
  <a class="btn copy-link" href="intent://thoughtful-shayne-mlfiles-5730e5e6.koyeb.app/watch/2211?hash=AgAD1R#Intent;scheme=https;type=video/mp4;package=com.mxtech.videoplayer.ad;action=android.intent.action.VIEW;end">
    <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/mx.png" class="player-logo"> Open in MX Player
  </a>

  <!-- ❌ VLC fallback only -->
  <p class="warning">
    ⚠️ VLC can't be opened directly from browser. Use the button below to copy the VLC link manually.
  </p>
  <button class="btn download" onclick="copyVlcLink()">
    <img src="https://i.postimg.cc/15TQ4y7B/vlc.png" class="player-logo"> Copy VLC Link
  </button>

  <!-- ✅ Download and Copy -->
  <button class="btn download" onclick="download()">⬇️ Download</button>
  <button class="btn copy-link" onclick="copyLink()">🔗 Copy Link</button>

  <!-- JS Includes -->
  <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
  <script>
    const fileUrl = "https://thoughtful-shayne-mlfiles-5730e5e6.koyeb.app/watch/2211?hash=AgAD1R";

    document.addEventListener('DOMContentLoaded', () => {
      new Plyr(document.querySelector('.plyr'));
    });

    function copyLink() {
      navigator.clipboard.writeText(fileUrl)
        .then(() => alert("✅ Link copied to clipboard!"))
        .catch(() => alert("❌ Failed to copy."));
    }

    function copyVlcLink() {
      const vlcUrl = "vlc://" + fileUrl;
      navigator.clipboard.writeText(vlcUrl)
        .then(() => alert("✅ VLC link copied. Open VLC and paste it."))
        .catch(() => alert("❌ Could not copy VLC link."));
    }

    function download() {
      window.location.href = fileUrl;
    }
  </script>

</body>
</html>
